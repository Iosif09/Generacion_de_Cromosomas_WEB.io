<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmo Genético - Monitor de Rendimiento Web</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="window-container">
        <div class="sidebar">
            
            <div class="group-box">
                <div class="group-box-title">Parámetros del Algoritmo</div>
                <div class="control-group">
                    <label for="txtMutacion">Prob. Mutación (0.0001 - 0.1):</label>
                    <input type="number" id="txtMutacion" min="0.0001" max="0.1000" step="0.0001" value="0.0100">
                </div>
                <div class="control-group">
                    <label for="txtGeneraciones">Número Máx. de Generaciones:</label>
                    <input type="number" id="txtGeneraciones" min="1" max="100000" step="1" value="50">
                </div>
                <div class="control-group">
                    <label for="txtEjecuciones">Ciclos / Veces a Ejecutar (Ej. 30):</label>
                    <input type="number" id="txtEjecuciones" min="1" max="500" step="1" value="30">
                </div>
            </div>

            <button id="btnIniciar">Iniciar Simulación</button>

            <div class="group-box">
                <div class="group-box-title">Estadísticas de Tiempo</div>
                <div class="stat-label" id="lblTiempoMin">Tiempo Mínimo: ---</div>
                <div class="stat-label" id="lblTiempoMax">Tiempo Máximo: ---</div>
                <div class="stat-label" id="lblTiempoProm">Tiempo Promedio: ---</div>
            </div>

            <div class="group-box hardware-box">
                <div class="group-box-title">Monitor de Recursos (Hardware)</div>
                <div class="stat-label blue-text" id="lblCPU">Uso del Procesador: Leyendo...</div>
                <div class="stat-label blue-text" id="lblRAM">RAM Web: Leyendo...</div>
                <div class="stat-label green-text" id="lblContadorGeneraciones">Total Gen. Procesadas: 0</div>
            </div>

            <textarea id="txtConsola" readonly placeholder="Salida de consola..."></textarea>
        </div>

        <div class="main-content">
            <div class="chart-container">
                <canvas id="graficoConvergencia"></canvas>
            </div>
        </div>
    </div>

    <div id="modalGraficas" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Análisis del Experimento - Campanas de Distribución Normal Gaussiana</h2>
                <span class="close-btn">&times;</span>
            </div>
            <div class="modal-body">
                <div class="gauss-chart-wrapper">
                    <canvas id="chartT"></canvas>
                </div>
                <div class="gauss-chart-wrapper">
                    <canvas id="chartX"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="java.js"></script>
</body>
</html>
